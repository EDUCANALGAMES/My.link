    root.style.setProperty('--c2', t.c2);
    root.style.setProperty('--c3', t.c3);
    root.style.setProperty('--a1', t.a1);
    root.style.setProperty('--a2', t.a2);
    root.style.setProperty('--glow', t.glow);
    root.style.setProperty('--tint', t.tint);
  }

  /* ЗАГРУЗКА / СОХРАНЕНИЕ */
  async function loadData() {
    try {
      const res = await fetch(API_URL + '/latest', { headers: { 'X-Master-Key': JSONBIN_MASTER_KEY } });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const rec = data.record;

      if (rec && Array.isArray(rec.sections) && rec.sections.length > 0) {
        siteData = {
          sections: rec.sections,
          theme: rec.theme || 'purple',
          views: typeof rec.views === 'number' ? rec.views : 0
        };
        initialized = true;
      } else {
        siteData = { sections: JSON.parse(JSON.stringify(DEFAULT_SECTIONS)), theme: 'purple', views: 0 };
        initialized = true;
        await saveData();
      }
    } catch(e) {
      console.error('Ошибка загрузки:', e);
      if (!initialized) siteData = { sections: JSON.parse(JSON.stringify(DEFAULT_SECTIONS)), theme: 'purple', views: 0 };
    }

    applyTheme(siteData.theme);

    /* СЧЁТЧИК ПРОСМОТРОВ — считаем 1 раз за сессию */
    const counted = sessionStorage.getItem('educanal_view_counted');
    if (!counted) {
      siteData.views = (siteData.views || 0) + 1;
      sessionStorage.setItem('educanal_view_counted', '1');
      saveData();
    }

    updateViewsDisplay();
    renderAll();
  }

  function updateViewsDisplay() {
    document.getElementById('viewsCount').textContent = (siteData.views || 0).toLocaleString('ru-RU');
  }

  async function saveData() {
    try {
      const res = await fetch(API_URL, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_MASTER_KEY },
        body: JSON.stringify(siteData)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return true;
    } catch(e) { console.error('Ошибка сохранения:', e); return false; }
  }

  function createListLink(item) {
    const a = document.createElement('a');
    a.className = 'link';
    a.href = item.url; a.target = '_blank';
    a.innerHTML = `
      <div class="icon ${item.icon}">${iconSymbols[item.icon] || '✦'}</div>
      <div class="text">${escapeHtml(item.name)}${item.sub ? `<small>${escapeHtml(item.sub)}</small>` : ''}</div>
      <div class="arrow">›</div>`;
    return a;
  }

  function createGridBtn(item) {
    const a = document.createElement('a');
    a.className = 'p-btn';
    a.href = item.url; a.target = '_blank';
    a.innerHTML = `
      <div class="icon ${item.icon}">${iconSymbols[item.icon] || '✦'}</div>
      ${escapeHtml(item.name)}`;
    return a;
  }

  function renderAll() {
    const wrap = document.getElementById('sectionsContainer');
    wrap.innerHTML = '';
    if (!siteData.sections || siteData.sections.length === 0) {
      wrap.innerHTML = '<div class="glass empty-box" style="width:100%;">Пока пусто… ✦</div>';
      return;
    }
    siteData.sections.forEach(sec => {
      const box = document.createElement('div');
      box.style.cssText = 'width:100%;display:flex;flex-direction:column;align-items:center;gap:0;';
      const title = document.createElement('div');
      title.className = 'section-title';
      title.textContent = '— ' + sec.title + ' —';
      box.appendChild(title);
      const container = document.createElement('div');
      container.className = sec.layout === 'grid' ? 'glass personal-row' : 'glass links';
      if (!sec.items || sec.items.length === 0) {
        container.innerHTML = '<div class="empty-box" style="grid-column:1/-1;width:100%;">Пока пусто… ✦</div>';
      } else {
        sec.items.forEach(it => {
          container.appendChild(sec.layout === 'grid' ? createGridBtn(it) : createListLink(it));
        });
      }
      box.appendChild(container);
      wrap.appendChild(box);
    });
  }

  function openModal(id) { document.getElementById(id).classList.add('active'); }
  function closeModal(id) { document.getElementById(id).classList.remove('active'); }

  /* СЕКРЕТНЫЙ ДОСТУП */
  let pressTimer = null;
  const avatar = document.getElementById('avatarTrigger');
  const startPress = () => { pressTimer = setTimeout(() => openModal('pwdModal'), 1500); };
  const cancelPress = () => { clearTimeout(pressTimer); };
  avatar.addEventListener('touchstart', startPress);
  avatar.addEventListener('touchend', cancelPress);
  avatar.addEventListener('touchcancel', cancelPress);
  avatar.addEventListener('mousedown', startPress);
  avatar.addEventListener('mouseup', cancelPress);
  avatar.addEventListener('mouseleave', cancelPress);

  let tapCount = 0, tapTimer = null;
  document.getElementById('footerTrigger').addEventListener('click', () => {
    tapCount++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => tapCount = 0, 1200);
    if (tapCount >= 5) { tapCount = 0; openModal('pwdModal'); }
  });

  function checkPassword() {
    const input = document.getElementById('pwdInput').value;
    const err = document.getElementById('pwdError');
    if (input === ADMIN_PASSWORD) {
      err.textContent = '';
      document.getElementById('pwdInput').value = '';
      closeModal('pwdModal');
      openModal('adminModal');
      renderThemeGrid();
      renderSectionsDropdown();
      renderAdminList();
    } else {
      err.textContent = '❌ Неверный пароль';
    }
  }
  document.getElementById('pwdInput').addEventListener('keypress', e => { if (e.key === 'Enter') checkPassword(); });

  /* СЕТКА ТЕМ */
  function renderThemeGrid() {
    const grid = document.getElementById('themeGrid');
    grid.innerHTML = '';
    Object.keys(THEMES).forEach(key => {
      const t = THEMES[key];
      const sw = document.createElement('div');
      sw.className = 'theme-swatch' + (siteData.theme === key ? ' active' : '');
      sw.style.background = t.preview;
      sw.title = t.name;
      sw.onclick = () => changeTheme(key);
      grid.appendChild(sw);
    });
  }

  async function changeTheme(name) {
    if (!THEMES[name]) return;
    siteData.theme = name;
    applyTheme(name);
    renderThemeGrid();
    await saveData();
  }

  /* ДРОПДАУН */
  function renderSectionsDropdown() {
    const grp = document.getElementById('sectionsOptgroup');
    grp.innerHTML = '';
    siteData.sections.forEach(sec => {
      const opt = document.createElement('option');
      opt.value = 'sec:' + sec.id;
      opt.textContent = (sec.layout === 'grid' ? '▦ ' : '📋 ') + sec.title;
      grp.appendChild(opt);
    });
    if (siteData.sections[0]) {
      document.getElementById('newTarget').value = 'sec:' + siteData.sections[0].id;
    }
  }

  document.getElementById('newTarget').addEventListener('change', e => {
    document.getElementById('newSectionWrap').style.display =
      e.target.value === '__new__' ? 'block' : 'none';
  });

  /* ДОБАВЛЕНИЕ */
  async function addItem() {
    const target = document.getElementById('newTarget').value;
    const name = document.getElementById('newName').value.trim();
    const sub  = document.getElementById('newSub').value.trim();
    const url  = document.getElementById('newUrl').value.trim();
    const icon = document.getElementById('newIcon').value;
    const err  = document.getElementById('addError');
    const succ = document.getElementById('addSuccess');
    const btn  = document.getElementById('addBtn');

    err.textContent = ''; succ.textContent = '';
    if (!name) { err.textContent = '⚠️ Введи название'; return; }
    if (!url)  { err.textContent = '⚠️ Введи ссылку'; return; }
    if (!/^https?:\/\//i.test(url)) { err.textContent = '⚠️ Ссылка должна начинаться с https://'; return; }

    const total = siteData.sections.reduce((s, sec) => s + sec.items.length, 0);
    if (total >= MAX_ITEMS) { err.textContent = `⚠️ Максимум ${MAX_ITEMS} элементов`; return; }

    const item = { id: genId(), name, sub, url, icon };

    if (target === '__new__') {
      const title = document.getElementById('newSectionName').value.trim();
      const layout = document.getElementById('newSectionLayout').value;
      if (!title) { err.textContent = '⚠️ Введи название секции'; return; }
      siteData.sections.push({ id: genId(), title, layout, items: [item] });
    } else if (target.startsWith('sec:')) {
      const sid = target.slice(4);
      const sec = siteData.sections.find(s => s.id === sid);
      if (!sec) { err.textContent = '⚠️ Секция не найдена'; return; }
      sec.items.push(item);
    }

    btn.disabled = true; btn.textContent = 'Сохранение…';
    const ok = await saveData();
    btn.disabled = false; btn.textContent = 'Добавить';

    if (ok) {
      renderAll(); renderSectionsDropdown(); renderAdminList();
      document.getElementById('newName').value = '';
      document.getElementById('newSub').value = '';
      document.getElementById('newUrl').value = '';
      document.getElementById('newIcon').value = 'custom';
      document.getElementById('newSectionName').value = '';
      document.getElementById('newTarget').value = '__new__';
      document.getElementById('newSectionWrap').style.display = 'none';
      succ.textContent = '✅ Добавлено и видно всем!';
      setTimeout(() => succ.textContent = '', 2500);
    } else {
      err.textContent = '❌ Ошибка сохранения. Проверь ключи JSONBin.';
    }
  }

  function makeGroupTitle(sec) {
    const div = document.createElement('div');
    div.className = 'admin-group-title';
    div.innerHTML = `
      <span>${sec.layout === 'grid' ? '▦' : '📋'} ${escapeHtml(sec.title)} <span style="opacity:.5;font-size:9px;letter-spacing:0;">(${sec.items.length})</span></span>
      <div class="sec-btns">
        <button onclick="renameSection('${sec.id}')">✏️</button>
        <button class="del" onclick="deleteSection('${sec.id}')">🗑</button>
      </div>`;
    return div;
  }

  function makeAdminItem(item) {
    const div = document.createElement('div');
    div.className = 'admin-item';
    div.innerHTML = `
      <div class="icon ${item.icon}">${iconSymbols[item.icon] || '✦'}</div>
      <div class="info"><b>${escapeHtml(item.name)}</b><span>${escapeHtml(item.url)}</span></div>
      <button onclick="deleteItem('${item.id}')">✕</button>`;
    return div;
  }

  function renderAdminList() {
    const list = document.getElementById('adminList');
    list.innerHTML = '';
    const total = siteData.sections.reduce((s, sec) => s + sec.items.length, 0);
    document.getElementById('counter').textContent = `Всего элементов: ${total} / ${MAX_ITEMS}`;

    if (siteData.sections.length === 0) {
      list.innerHTML = '<div style="text-align:center;opacity:.6;font-size:13px;padding:14px;">Пока нет секций. Создай первую 👆</div>';
      return;
    }
    siteData.sections.forEach(sec => {
      list.appendChild(makeGroupTitle(sec));
      if (sec.items.length === 0) {
        const empty = document.createElement('div');
        empty.style.cssText = 'font-size:12px;opacity:.5;padding:6px 12px;text-align:center;';
        empty.textContent = 'Пусто';
        list.appendChild(empty);
      } else {
        sec.items.forEach(it => list.appendChild(makeAdminItem(it)));
      }
    });
  }

  async function deleteItem(id) {
    if (!confirm('Удалить этот элемент?')) return;
    let found = false;
    for (const sec of siteData.sections) {
      const j = sec.items.findIndex(x => x.id === id);
      if (j !== -1) { sec.items.splice(j, 1); found = true; break; }
    }
    if (found) { await saveData(); renderAll(); renderSectionsDropdown(); renderAdminList(); }
  }

  async function deleteSection(id) {
    const idx = siteData.sections.findIndex(s => s.id === id);
    if (idx === -1) return;
    const sec = siteData.sections[idx];
    if (!confirm(`Удалить секцию "${sec.title}" и все её ${sec.items.length} элемент(ов)?`)) return;
    siteData.sections.splice(idx, 1);
    await saveData(); renderAll(); renderSectionsDropdown(); renderAdminList();
  }

  async function renameSection(id) {
    const sec = siteData.sections.find(s => s.id === id);
    if (!sec) return;
    const newName = prompt('Новое название секции:', sec.title);
    if (newName === null) return;
    const trimmed = newName.trim();
    if (!trimmed) { alert('Название не может быть пустым'); return; }
    sec.title = trimmed;
    await saveData(); renderAll(); renderSectionsDropdown(); renderAdminList();
  }

  async function clearAll() {
    if (!confirm('Удалить ВСЁ и вернуть стандартные разделы? Все твои кнопки пропадут!')) return;
    const backup = JSON.parse(JSON.stringify(siteData));
    siteData = { sections: JSON.parse(JSON.stringify(DEFAULT_SECTIONS)), theme: siteData.theme, views: siteData.views };
    const ok = await saveData();
    if (!ok) { siteData = backup; alert('Ошибка сброса'); }
    renderAll(); renderSectionsDropdown(); renderAdminList();
  }

  document.querySelectorAll('.modal-overlay').forEach(m => {
    m.addEventListener('click', e => { if (e.target === m) m.classList.remove('active'); });
  });

  loadData();
</script>
